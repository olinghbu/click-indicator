name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          for d in build*; do
            [ -d "$d" ] || continue
            cmake --build "$d" --config RelWithDebInfo 2>&1 | grep -iE "error|fatal" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          done
          ls

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Click Indicator
          path: ${{ steps.build.outputs.build-output }}

      - name: Publish .geode as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.1
          name: Click Indicator v0.1.0-alpha.1
          prerelease: true
          files: ${{ steps.build.outputs.build-output }}/*.geode
